<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B1220" />
  <title>Pagamento confirmado: Shopylitcs</title>
  <link rel="icon" href="/assets/SHOPLUTICS.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Outfit:wght@700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/landing.css?v=4" />
  <style>
    .success-page {
      min-height: 100svh; display: grid; place-items: center;
      padding: 2rem 1rem; background: var(--cream);
    }
    .success-card {
      width: min(420px, 100%); padding: 2rem 1.35rem 1.5rem;
      border: 1px solid var(--line); border-radius: var(--radius);
      background: var(--paper); box-shadow: var(--shadow); text-align: center;
    }
    .success-card img { width: 48px; height: 48px; border-radius: 10px; margin: 0 auto 1rem; }
    .success-card h1 {
      margin: 0 0 0.5rem; font-family: var(--display);
      font-size: 1.5rem; letter-spacing: -0.03em; color: var(--sidebar);
    }
    .success-card p { margin: 0 0 1.25rem; color: var(--slate-600); font-size: 0.95rem; }
    .success-actions { display: grid; gap: 0.55rem; }
  </style>
</head>
<body>
  <main class="success-page">
    <div class="success-card">
      <img src="/assets/SHOPLUTICS.png" alt="Shopylitcs" width="48" height="48" />
      <h1>Pagamento confirmado</h1>
      <p>Sua assinatura está ativa. Entre no painel com o mesmo e-mail usado no Checkout.</p>
      <div class="success-actions">
        <a class="btn btn-primary btn-block" href="/app">Entrar no painel</a>
        <a class="btn btn-secondary btn-block" href="/">Voltar à página inicial</a>
      </div>
    </div>
  </main>
</body>
</html>
